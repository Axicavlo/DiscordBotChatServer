<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오목</title>
<link rel="stylesheet" href="/gomoku/assets/room.css">
<script src="/gomoku/assets/room.js" defer></script>
</head>
<body>
<main id="room" class="room" hidden>
  <header class="status">
    <div><strong id="turn">대기실</strong> <time id="turn-clock" hidden></time></div>
    <span id="watch-count"><svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg> <span id="spectator-count">0</span></span>
  </header>
  <div id="scroll" class="play-scroll">
    <div class="play-content">
    <section class="game">
      <div id="lobby" class="square lobby">
        <div id="versus" class="versus"></div>
        <fieldset id="settings" hidden>
          <legend>대국 설정</legend>
          <div class="mode-switch" role="group" aria-label="게임 모드">
            <button id="normal-mode" type="button" aria-pressed="true">일반</button>
            <button id="blitz-mode" type="button" aria-pressed="false">블리츠</button>
          </div>
          <label class="time-setting"><span>제한시간</span><select id="seconds"></select></label>
        </fieldset>
        <div id="ready-controls" hidden>
          <button type="button" id="black" class="stone-choice" aria-label="흑돌" title="흑돌"><span class="stone black" aria-hidden="true"></span></button>
          <button type="button" id="white" class="stone-choice" aria-label="백돌" title="백돌"><span class="stone white" aria-hidden="true"></span></button>
          <button type="button" id="ready">준비</button>
        </div>
      </div>
      <div id="board" class="square board" aria-label="15줄 오목판" hidden></div>
      <p id="notice" class="notice" aria-live="polite"></p>
      <div id="result" class="result" hidden></div>
      <div class="dots" aria-hidden="true">•••</div>
    </section>
    <aside id="people" class="people">
      <h1>접속자</h1>
      <div id="players"></div>
      <section class="spectators">
        <h2 id="spectator-heading">관전자 0명</h2>
        <ul id="spectators"></ul>
      </section>
      <div class="room-actions"><button type="button" id="close" hidden>방 닫기</button>
      <button type="button" class="exit" hidden>나가기</button></div>
    </aside>
    </div>
  </div>
  <aside id="chat" class="chat">
    <header>
      <h1>채팅</h1>
      <button id="theme" class="theme" type="button" role="switch" aria-checked="false" aria-label="다크 모드"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 15.6A9 9 0 0 1 8.4 3.2 9 9 0 1 0 20.8 15.6Z"/></svg><i></i></button>
    </header>
    <div id="messages" class="messages" role="log" aria-label="채팅 메시지"></div>
    <form id="composer">
      <div id="emoji-panel" class="emoji-panel" role="group" aria-label="서버 이모지" hidden></div>
      <button id="emoji-toggle" class="emoji-toggle" type="button" aria-label="서버 이모지" aria-controls="emoji-panel" aria-expanded="false"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 13.5a4.5 4.5 0 0 0 8 0M9 9.5h.01m5.98 0H15"/></svg></button>
      <textarea id="message" placeholder="메시지 입력" aria-label="메시지 입력" maxlength="1000" rows="1"></textarea>
      <button class="send" type="submit">전송</button>
    </form>
  </aside>
</main>
<p id="connection" class="connection" role="status">방에 연결하는 중입니다.</p>
</body>
</html>
